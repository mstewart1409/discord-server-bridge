[project]
name = "discord-server-bridge"
version = "0.3.0"
description = ""
authors = [{ name = "Michael Stewart", email = "14077535+mstewart1409@users.noreply.github.com" }]
requires-python = ">=3.13.11,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "discord.py>=2.4.0,<3",
    "sqlalchemy[asyncio]>=2.0.32,<3",
    "psycopg[binary]>=3.2.0,<4",
    "bleach>=6.1.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0,<10",
    "pytest-mock==3.15.1",
    "pytest-asyncio>=1.0.0,<2",
    "aiosqlite>=0.20.0,<0.22",
    "coverage>=7.2.2,<8",
    "pre-commit>=4.0.0,<5",
    "commitizen>=3.6.0,<4",
]

[tool.uv]

[tool.uv.build-backend]
module-name = ["dsbridge"]
module-root = ""


[tool.hatch.build.targets.sdist]
include = ["dsbridge"]

[tool.hatch.build.targets.wheel]
include = ["dsbridge"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "tests"
]

[tool.ruff.lint]
ignore = [
    "E731"
]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.3.0"
version_files = [
    "pyproject.toml:version",
    "dsbridge/__init__.py:__version__"
]
tag_format = "$version"
update_changelog_on_bump = true
pre_bump_hooks = []


[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Loaded explicitly so the suite still runs where PYTEST_DISABLE_PLUGIN_AUTOLOAD is set.
addopts = "-p pytest_asyncio.plugin"
